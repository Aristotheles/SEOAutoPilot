[package]
name = "seoautopilot"
version = "0.12.1"
description = "Human-approved SEO opportunity engine"
authors = ["Aristotheles"]
edition = "2021"

[lib]
name = "seoautopilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

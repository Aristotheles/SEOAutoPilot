name: Release portable package

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run verify
      - run: npm run smoke
      - run: npm run build:exe
      - run: npm run smoke:exe
      - name: Build release files and checksums
        shell: pwsh
        run: |
          $name = "SEOAutoPilot-${{ github.ref_name }}-portable"
          git archive --format=zip --output "$name.zip" HEAD
          Copy-Item "dist/SEOAutoPilot.exe" "SEOAutoPilot-${{ github.ref_name }}-windows-x64.exe"
          foreach ($file in @("$name.zip", "SEOAutoPilot-${{ github.ref_name }}-windows-x64.exe")) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file" | Set-Content "$file.sha256" -Encoding ascii
          }
      - name: Attest release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            SEOAutoPilot-${{ github.ref_name }}-portable.zip
            SEOAutoPilot-${{ github.ref_name }}-windows-x64.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SEOAutoPilot-${{ github.ref_name }}-release
          path: |
            SEOAutoPilot-${{ github.ref_name }}-portable.zip
            SEOAutoPilot-${{ github.ref_name }}-portable.zip.sha256
            SEOAutoPilot-${{ github.ref_name }}-windows-x64.exe
            SEOAutoPilot-${{ github.ref_name }}-windows-x64.exe.sha256
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          ## Windows

          `SEOAutoPilot-${{ github.ref_name }}-windows-x64.exe` dosyasını indirip çalıştır. Tarayıcı otomatik açılır; Node.js kurulumu gerekmez. Bu sürüm kod imzalama sertifikası bulunmadığı için imzasızdır ve Windows SmartScreen ilk açılışta uyarı gösterebilir.

          Download and run `SEOAutoPilot-${{ github.ref_name }}-windows-x64.exe`. It opens the browser automatically and does not require Node.js. This build is unsigned because the project does not yet have a code-signing certificate, so Windows SmartScreen may warn on first launch.

          SHA-256 files and GitHub artifact attestations are included for verification.
          '@ | Set-Content release-notes.md -Encoding utf8
          gh release create "${{ github.ref_name }}" --verify-tag --notes-file release-notes.md `
            "SEOAutoPilot-${{ github.ref_name }}-portable.zip" `
            "SEOAutoPilot-${{ github.ref_name }}-portable.zip.sha256" `
            "SEOAutoPilot-${{ github.ref_name }}-windows-x64.exe" `
            "SEOAutoPilot-${{ github.ref_name }}-windows-x64.exe.sha256"

name: Release source package

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm run verify
      - run: npm run smoke
      - name: Build source archive and checksum
        shell: pwsh
        run: |
          $name = "SEOAutoPilot-${{ github.ref_name }}-portable"
          git archive --format=zip --output "$name.zip" HEAD
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content "$name.zip.sha256" -Encoding ascii
      - name: Attest source archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            SEOAutoPilot-${{ github.ref_name }}-portable.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SEOAutoPilot-${{ github.ref_name }}-source
          path: |
            SEOAutoPilot-${{ github.ref_name }}-portable.zip
            SEOAutoPilot-${{ github.ref_name }}-portable.zip.sha256
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          > [!IMPORTANT]
          > Bu sürüm yalnız kaynak arşividir. Windows EXE, güvenilir kod imzalama süreci tamamlanana kadar yayımlanmaz.

          This is a source-only release. No Windows EXE is published until a trustworthy code-signing pipeline is available. SHA-256 and GitHub artifact attestation are included.
          '@ | Set-Content release-notes.md -Encoding utf8
          gh release create "${{ github.ref_name }}" --verify-tag --notes-file release-notes.md `
            "SEOAutoPilot-${{ github.ref_name }}-portable.zip" `
            "SEOAutoPilot-${{ github.ref_name }}-portable.zip.sha256"

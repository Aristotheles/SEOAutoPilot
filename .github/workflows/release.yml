name: Release source package

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run smoke
      - name: Build source archive and checksum
        shell: pwsh
        run: |
          $name = "SEOAutoPilot-${{ github.ref_name }}-portable"
          git archive --format=zip --output "$name.zip" HEAD
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content "$name.zip.sha256" -Encoding ascii
      - name: Build Windows desktop installers
        run: npm run tauri:build
      - name: Scan installers with Windows Defender
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          $msi = Get-ChildItem -Path src-tauri/target/release/bundle/msi -Filter *.msi | Select-Object -First 1
          if (-not $exe -or -not $msi) { throw "Expected Tauri bundle outputs (nsis .exe / msi .msi) were not found." }
          "EXE_PATH=$($exe.FullName)" >> $env:GITHUB_ENV
          "MSI_PATH=$($msi.FullName)" >> $env:GITHUB_ENV

          $mpcmd = Get-ChildItem -Path "$env:ProgramData\Microsoft\Windows Defender\Platform" -Filter MpCmdRun.exe -Recurse -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          $scanStatus = 'unavailable'
          if (-not $mpcmd) {
            Write-Warning "MpCmdRun.exe was not found on this runner; publishing without a Defender scan."
          } else {
            try { Start-Service -Name WinDefend -ErrorAction Stop } catch { Write-Host "WinDefend service could not be started: $($_.Exception.Message)" }
            $scanStatus = 'clean'
            foreach ($file in @($exe.FullName, $msi.FullName)) {
              Write-Host "Scanning $file with Windows Defender..."
              $output = (& $mpcmd.FullName -Scan -ScanType 3 -File $file 2>&1 | Out-String)
              Write-Host $output
              # GitHub-hosted Windows runners pre-exclude the workspace directory from Defender
              # (and the antimalware service itself is sometimes unreachable), so this scan can
              # legitimately come back "skipped" or unreachable for reasons that say nothing
              # about the file. Only an explicit, unambiguous detection blocks publishing;
              # anything else (skipped / unreachable / unrecognized output) is inconclusive and
              # must not silently masquerade as "clean" either - both cases are reported below.
              if ($output -match '(?i)threat' -and $output -notmatch '(?i)found no threats' -and $output -notmatch '(?i)\b0 threats\b') {
                throw "Windows Defender flagged $file. Refusing to publish.`n$output"
              } elseif ($output -notmatch 'found no threats') {
                Write-Warning "Could not obtain a definitive Defender verdict for $file (scan was skipped or unreachable on this runner)."
                $scanStatus = 'unavailable'
              }
            }
          }
          "DEFENDER_SCAN_STATUS=$scanStatus" >> $env:GITHUB_ENV
      - name: Compute installer checksums
        shell: pwsh
        run: |
          foreach ($path in @($env:EXE_PATH, $env:MSI_PATH)) {
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $name = Split-Path -Leaf $path
            "$hash  $name" | Set-Content "$path.sha256" -Encoding ascii
          }
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            SEOAutoPilot-${{ github.ref_name }}-portable.zip
            ${{ env.EXE_PATH }}
            ${{ env.MSI_PATH }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SEOAutoPilot-${{ github.ref_name }}-source
          path: |
            SEOAutoPilot-${{ github.ref_name }}-portable.zip
            SEOAutoPilot-${{ github.ref_name }}-portable.zip.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SEOAutoPilot-${{ github.ref_name }}-windows
          path: |
            ${{ env.EXE_PATH }}
            ${{ env.EXE_PATH }}.sha256
            ${{ env.MSI_PATH }}
            ${{ env.MSI_PATH }}.sha256
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:DEFENDER_SCAN_STATUS -eq 'clean') {
            $scanLineTr = 'Kurucu dosyalar yayımlanmadan önce bu iş akışında Windows Defender ile tarandı ve temiz çıktı.'
            $scanLineEn = 'The installers were scanned with Windows Defender in this workflow before publishing and came back clean.'
          } else {
            $scanLineTr = "Bu çalıştırmada Windows Defender'ın tarama altyapısına ulaşılamadı; kurucular otomatik olarak taranamadı (bu bir tespit değil, çalıştırıcının kısıtıdır)."
            $scanLineEn = 'The Defender scan engine was not reachable on this run, so the installers could not be automatically scanned (this reflects a runner limitation, not a detection).'
          }
          $notes = "> [!NOTE]`n> Bu derleme henüz ücretli bir kod imzalama sertifikasıyla imzalanmadı; Windows SmartScreen ilk çalıştırmada bir uyarı gösterebilir (`"Daha fazla bilgi`" -> `"Yine de çalıştır`"). $scanLineTr`n>`n> This build is not signed with a paid code-signing certificate yet, so Windows SmartScreen may show a warning on first run (`"More info`" -> `"Run anyway`"). $scanLineEn SHA-256 checksums and GitHub artifact attestations are included for verification.`n"
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          gh release create "${{ github.ref_name }}" --verify-tag --notes-file release-notes.md `
            "SEOAutoPilot-${{ github.ref_name }}-portable.zip" `
            "SEOAutoPilot-${{ github.ref_name }}-portable.zip.sha256" `
            "$env:EXE_PATH" `
            "$env:EXE_PATH.sha256" `
            "$env:MSI_PATH" `
            "$env:MSI_PATH.sha256"
